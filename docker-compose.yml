services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondbrain}
      POSTGRES_DB: secondbrain
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain -d secondbrain"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://secondbrain:${POSTGRES_PASSWORD:-secondbrain}@db:5432/secondbrain
      API_HOST: 0.0.0.0
      API_PORT: 4010
      TZ: ${TZ:-Europe/Moscow}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
    ports:
      - "4010:4010"
    volumes:
      - ./backups:/app/backups

volumes:
  db:
